<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

    <header>
        <div class="profile-area">
            <div class="profile-icon">👤</div>
            <span class="profile-name">Maame Saah</span>
        </div>
        <h1>My Todo List</h1>
    </header>

    <main id="todo-list">

       <div class="add-chore">
            <div class="todo-text">
                <h2>New Task</h2>
                <input id="chore-title"       type="text" placeholder="Task title">
                <input id="chore-description" type="text" placeholder="Details">
            </div>
            <button id="add-chore-btn" class="add-btn">＋</button>
        </div>

    </main>
     
    <script src="script.js"></script>
</body>
</html>
